[workspace]
members = [
  # Foundation
  # The first two are workspace-internal: no binding surface. `classic-shared-core`
  # is not — the CXX bridge exposes it.
  "foundation/classic-operation-context",
  "foundation/classic-vocabulary",
  "foundation/classic-shared-core",
  # Business Logic (Pure Rust)
  # Workspace-internal: no binding surface, absent from the parity matrix.
  "business-logic/classic-durable-publication",
  "business-logic/classic-database-core",
  "business-logic/classic-file-io-core",
  "business-logic/classic-scanlog-core",
  "business-logic/classic-scan-presentation",
  # Crash Log Scan Launch (ADR-0009): sits above scanlog core and User Settings.
  "business-logic/classic-scan-launch",
  "business-logic/classic-config-core",
  "business-logic/classic-user-settings-core",
  "business-logic/classic-scangame-core",
  # Phase 1 - Core Infrastructure (Business Logic)
  "business-logic/classic-registry-core",
  "business-logic/classic-message-core",
  # Phase 2 - Path Management (Business Logic)
  "business-logic/classic-path-core",
  "business-logic/classic-resource-core",
  "business-logic/classic-xse-core",
  "business-logic/classic-web-core",
  # Phase 5 - Application Coordination (Business Logic)
  "business-logic/classic-update-core",
  # Version Registry (Game version detection and matching)
  "business-logic/classic-version-registry-core",
  # UI Applications
  "ui-applications/classic-tui",
  # C++ Bindings (CXX FFI adapters)
  "cpp-bindings/classic-cpp-bridge",
  # Repository tooling (`cargo xtask <command>`); links no product crate.
  "xtask",
]
resolver = "2"

[workspace.dependencies]
# Async runtime (ONE RUNTIME RULE)
futures = "0.3.32"
tokio = {version = "1.54.1", features = ["full"]}

# Performance
crossbeam = "0.8.5"
dashmap = "6.2.1"
num_cpus = "1.17.0"
parking_lot = "0.13.0"
rayon = "1.12.0"

# YAML
# No default features: the `encoding` feature (YamlDecoder) is unused, and since
# 0.13.1 it pins `encoding_rs = "=0.8.35"`, which conflicts with the workspace's
# newer encoding_rs.
yaml-rust2 = {version = "0.13.1", default-features = false}

# Strings & errors
anyhow = "1.0.104"
lasso = {version = "0.7.3", features = [
  "multi-threaded",
]} # Fast string interning (optimization 3.1)
smartstring = "2.0.0"
string_cache = "0.9.0"
thiserror = "2.0.21"

# Database
sqlx = {version = "0.9.1", features = ["runtime-tokio", "sqlite"]}

# File I/O
chardetng = "1.0.0" # Character encoding detection (Phase 5 - PapyrusLog)
ddsfile = "0.6.0"
directories = "6.0.0" # Cross-platform config/data directories
dirs = "7.0.0"
encoding_rs = "0.8.44"
memmap2 = "0.9.12"
walkdir = "2.5.0"

# BA2 Archive support
ba2 = "3.0.1"

# Parsing
aho-corasick = "1.1.5"
memchr = "2.8.3"
regex = "1.13.2"

# Alternative allocator (Phase 16 optimization - optional)
mimalloc = {version = "0.1.52", default-features = false}

# Ordered collections
indexmap = "2.14.2" # Preserves insertion order (required for YAML key order parity)

# Caching
linked-hash-map = "0.5.6"
lru = "0.19.1"
quick_cache = "0.7.0" # Lock-free concurrent cache (optimization 1.3)
rustc-hash = "2.1.3" # Fast hasher for short strings (optimization 1.2)

# Hashing
sha2 = "0.11.1" # Cryptographic hashing (SHA256 for file comparison)
xxhash-rust = {version = "0.8.21", features = [
  "xxh3",
]} # Fast non-cryptographic hash (optimization 4.1)

# Text processing
configparser = "3.3.0" # INI file parsing
strsim = "0.11.1" # String similarity algorithms

# Version parsing
pelite = "0.10.0" # PE file parsing for version extraction
semver = "1.0.28" # Semantic versioning for crashgen version comparison

# Serialization
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"

# Network (Phase 5 - Update system)
reqwest = {version = "0.13.5", features = ["json"]} # Async HTTP client
scraper = "0.29.0" # HTML parsing

# Logging
env_logger = "0.11.12"
log = "0.4.35"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

# C++ FFI (CXX)
cxx = "1.0.205"
cxx-build = "1.0.205"

# Platform-specific
winreg = "0.56.0"

# Markdown
pulldown-cmark = {version = "0.13.6", default-features = false}

# Repository tooling (xtask)
clap = "4.6.9"
proc-macro2 = "1.0.107"
syn = "3.0.10"
tiny_http = "0.12.0"
# No gzip: an un-negotiated body is hashed exactly as served.
ureq = {version = "3.5.2", default-features = false, features = ["rustls"]}

# Testing
tempfile = "3.27.0"

[workspace.lints.rust]
deprecated = "deny"
unused = "deny"

[workspace.lints.cargo]
unused_dependencies = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[profile.release-with-debug]
debug = true
inherits = "release"
