[project]
dependencies = [
  "pytest>=9.1.1",
  "ruamel.yaml>=0.18,<0.19",
]
description = "Tools-only environment for the remaining Python repository tooling under tools/ while it is ported to cargo xtask (ADR-0010). Removed with the last Python tool."
name = "classic-repo-tools"
requires-python = ">=3.12"
version = "0.0.0"

[tool.uv]
# This project hosts tooling, not an installable package. `package = false` tells uv
# not to attempt to build/install the current directory into the venv.
package = false
