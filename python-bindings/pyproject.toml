[project]
dependencies = [
  "classic-py-cli",
  "maturin>=1.15.0,<2.0",
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "ruff>=0.16.9",
  "ruamel.yaml>=0.18,<0.19",
]
description = "CLASSIC Python binding build/test tooling: maturin runner for the classic-*-py crates plus the pytest smoke-test suite."
name = "classic-python-bindings-tools"
requires-python = ">=3.12"
version = "0.0.0"

[tool.uv]
# This project hosts tooling, not an installable package. `package = false` tells uv
# not to attempt to build/install the current directory into the venv.
package = false

[tool.uv.sources]
classic-py-cli = {path = "classic-py-cli", editable = true}

[tool.ruff.lint.per-file-ignores]
# The maintained stubs must name every native export, including the
# `__repr__`/`__str__` each pyclass implements: `validate_stubs.py` fails with
# "Missing maintained stub names" when they are dropped, so ruff's
# "redundant in a stub" advice (PYI029) conflicts with the stub contract.
"*.pyi" = ["PYI029"]
