[package]
name = "classic-path-py"
version = "9.1.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["CLASSIC Development Team"]
description = "Python bindings for classic-path-core"
license = "MIT"

[lib]
name = "classic_path"
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyO3 bindings
pyo3 = { workspace = true, features = ["extension-module"] }

# Shared Python binding utilities
classic-shared-py = { path = "../../foundation/classic-shared-py" }

# Core path management business logic
classic-path-core = { path = "../../business-logic/classic-path-core" }

# Generic path primitives (existence, kind, permission, drive, read-only) and PathError
classic-shared-core = { path = "../../foundation/classic-shared-core" }

# Version-labelled backup (BackupManager / XseVersion facade classes)
classic-resource-core = { path = "../../business-logic/classic-resource-core" }

[lints.rust]
deprecated = "deny"
rust_2024_compatibility = "deny"
unsafe_code = "deny"  # We don't use unsafe in CLASSIC
missing_docs = "warn"   # Encourage documentation
unused = "deny"
