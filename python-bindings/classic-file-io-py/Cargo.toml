[package]
name = "classic-file-io-py"
version = "9.1.0"
edition = "2024"
rust-version = "1.96.0"

[lib]
name = "classic_file_io"  # Python module name
crate-type = ["cdylib", "rlib"]  # Python extension + Rust library

[dependencies]
classic-file-io-core = { path = "../../business-logic/classic-file-io-core" }
# `PyLogCollector` stays exported from `classic_file_io` for import
# compatibility, but Crash Log collection is owned by scanlog core (#254).
classic-scanlog-core = { path = "../../business-logic/classic-scanlog-core" }
# `DDSAnalyzer` stays exported from `classic_file_io` for import compatibility,
# but game-target DDS rules are owned by resource core (#249).
classic-resource-core = { path = "../../business-logic/classic-resource-core" }
# `FileGenerator`, `FileGeneratorConfig`, and the generate_* functions stay
# exported from `classic_file_io` for import compatibility, but Ignore/Local
# YAML generation is owned by config core (#248).
classic-config-core = { path = "../../business-logic/classic-config-core" }
classic-shared-core = { path = "../../foundation/classic-shared-core" }
classic-shared-py = { path = "../../foundation/classic-shared-py" }
pyo3 = { workspace = true }
pyo3-async-runtimes = { workspace = true, features = ["tokio-runtime"] }
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = "0.8.2"

[[bench]]
name = "gil_benchmarks"
harness = false

[lints.rust]
deprecated = "deny"
rust_2024_compatibility = "warn"
unsafe_code = "forbid"  # We don't use unsafe in CLASSIC
missing_docs = "warn"   # Encourage documentation
unused = "deny"
