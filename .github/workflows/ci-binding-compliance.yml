name: CI - Binding Compliance

on:
  push:
    branches: [classic-next]
  pull_request:
    branches: [classic-next]

permissions:
  contents: read

jobs:
  rust:
    uses: ./.github/workflows/ci-rust.yml
  native:
    uses: ./.github/workflows/ci-cpp.yml

  full:
    name: Full Repository Conformance
    needs: [rust, native]
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      RUST_BACKTRACE: 1
      CARGO_TERM_COLOR: always
    steps:
      # Reusable workflows and this default checkout share the event revision
      # and Windows workspace layout. Immutable plans are never rewritten.
      - uses: actions/checkout@v6

      - name: Download current-run conformance artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*conformance*'
          path: ${{ runner.temp }}/conformance
          merge-multiple: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Exactly the two reusable participant workflows (rust, native) must have
      # succeeded. The verdict below still runs after a failure, via
      # !cancelled(), so its report names every incomplete family.
      - name: Require every retained participant job to pass
        if: ${{ !cancelled() }}
        env:
          PARTICIPANT_RESULTS: ${{ toJSON(needs) }}
        run: |
          $results = $env:PARTICIPANT_RESULTS | ConvertFrom-Json -AsHashtable
          if ($results.Count -ne 2 -or @($results.Values | Where-Object { $_.result -ne 'success' }).Count -ne 0) {
            throw 'Every retained participant workflow must pass before repository conformance can pass.'
          }

      # Every downloaded run plan is authenticated against this checkout, and
      # every pack's family must pass on every required (participant,
      # execution instance).
      - name: Run full repository conformance verdict
        if: ${{ !cancelled() }}
        run: cargo xtask conformance verdict --receipts ${{ runner.temp }}/conformance --output ${{ runner.temp }}/conformance-verdict/verdict.json

      - name: Upload full repository conformance verdict
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-repository-verdict
          path: ${{ runner.temp }}/conformance-verdict/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
