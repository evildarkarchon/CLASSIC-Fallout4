name: CI - C++

on:
  workflow_call:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  corrosion-source:
    name: Pinned Corrosion Source
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Archive verified Corrosion v0.6.1 source
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:RUNNER_TEMP 'classic-corrosion-checkout'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'classic-corrosion-artifact'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          git clone --depth 1 --branch v0.6.1 https://github.com/corrosion-rs/corrosion.git $sourceDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch pinned Corrosion source.' }
          $revision = (& git -C $sourceDir rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -cne '1499b14e4906a2890f5cee1547c8848db261753d') {
            throw "Corrosion v0.6.1 resolved to unexpected commit '$revision'."
          }
          $archivePath = Join-Path $artifactDir 'corrosion-source.zip'
          git -C $sourceDir archive --format=zip --output=$archivePath HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not archive verified Corrosion source.' }
          $archiveDigest = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $artifactDir 'corrosion-source.commit'), "$revision`n")
          [System.IO.File]::WriteAllText((Join-Path $artifactDir 'corrosion-source.sha256'), "$archiveDigest`n")

      # Archive tracked source only; the clone's .git directory stays on this runner.
      - name: Upload pinned Corrosion source
        uses: actions/upload-artifact@v6
        with:
          name: corrosion-source-v0.6.1
          path: ${{ runner.temp }}/classic-corrosion-artifact/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Consumer-driven bridge rule (docs/api/cxx-bridge-policy.md): every CXX
  # export needs a classic-cli/src or classic-gui/src production caller. The
  # gate is source-only, so it needs no `needs:` and runs alongside the CLI and
  # GUI jobs; the build wrappers deliberately do not call it.
  cxx-bridge-gate:
    name: CXX Bridge Gate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build xtask
        run: cargo build -p xtask --locked

      - name: Check for orphan CXX bridge exports
        run: cargo xtask cxx-bridge-gate

  cli-tests:
    name: CLI Tests (${{ matrix.compiler }})
    needs: [corrosion-source]
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang-cl]
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download pinned Corrosion source
        uses: actions/download-artifact@v8
        with:
          name: corrosion-source-v0.6.1
          path: ${{ runner.temp }}/classic-corrosion-artifact

      - name: Verify and extract pinned Corrosion source
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'classic-corrosion-artifact'
          $archivePath = Join-Path $artifactDir 'corrosion-source.zip'
          $revision = (Get-Content -LiteralPath (Join-Path $artifactDir 'corrosion-source.commit') -Raw).Trim()
          if ($revision -cne '1499b14e4906a2890f5cee1547c8848db261753d') {
            throw "Downloaded Corrosion source has unexpected revision '$revision'."
          }
          $expectedDigest = (Get-Content -LiteralPath (Join-Path $artifactDir 'corrosion-source.sha256') -Raw).Trim()
          $actualDigest = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualDigest -cne $expectedDigest) { throw 'Downloaded Corrosion source digest does not match.' }
          $sourceDir = Join-Path $env:RUNNER_TEMP 'classic-corrosion-source'
          Expand-Archive -LiteralPath $archivePath -DestinationPath $sourceDir -Force
          if (-not (Test-Path -LiteralPath (Join-Path $sourceDir 'CMakeLists.txt') -PathType Leaf)) {
            throw 'Downloaded Corrosion source is missing CMakeLists.txt.'
          }
          "CLASSIC_CORROSION_SOURCE_DIR=$sourceDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.compiler }}-cargo-cpp-cli-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('foundation/**/*.rs', 'business-logic/**/*.rs', 'cpp-bindings/**/*.rs', 'ui-applications/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-cargo-cpp-cli-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-${{ matrix.compiler }}-cargo-cpp-cli-

      - name: Cache vcpkg root
        uses: actions/cache@v5
        with:
          path: ~\vcpkg
          key: ${{ runner.os }}-${{ matrix.compiler }}-vcpkg-root-${{ hashFiles('.github/scripts/setup-vcpkg.ps1', 'classic-cli/vcpkg.json', 'classic-gui/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-vcpkg-root-

      - name: Set up vcpkg (resilient)
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File .github/scripts/setup-vcpkg.ps1

      - name: Build and test CLI
        timeout-minutes: 90
        run: pwsh -ExecutionPolicy Bypass -File classic-cli/build_cli.ps1 -Test -Compiler ${{ matrix.compiler }}

      # Both runs reuse the build above through `-Test -TestOnly` and still run
      # after an earlier failed step, so conformance results are reported
      # either way. The artifact root lives under runner.temp, not the cached
      # target/, so no earlier run's plans can reach these uploads.
      - name: Run native CXX conformance
        if: ${{ !cancelled() }}
        run: cargo xtask conformance run --participant cxx --compiler ${{ matrix.compiler }} --artifact-root ${{ runner.temp }}/conformance

      - name: Run CLI consumer conformance
        if: ${{ !cancelled() }}
        run: cargo xtask conformance run --participant cli --compiler ${{ matrix.compiler }} --artifact-root ${{ runner.temp }}/conformance

      - name: Upload native CXX conformance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cxx-conformance-${{ matrix.compiler }}
          path: ${{ runner.temp }}/conformance/cxx/windows-${{ matrix.compiler }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload CLI consumer conformance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cli-conformance-${{ matrix.compiler }}
          path: ${{ runner.temp }}/conformance/cli/windows-${{ matrix.compiler }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload CLI diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cli-test-diagnostics-${{ matrix.compiler }}
          path: |
            classic-cli/build*/Testing/
            classic-cli/build*/CMakeFiles/CMake*.log
            classic-cli/build*/CMakeFiles/CMakeConfigureLog.yaml
            classic-cli/build*/vcpkg*.log
            classic-cli/build*/**/vcpkg*.log
          if-no-files-found: warn
          retention-days: 7

  gui-tests:
    name: GUI Tests (${{ matrix.compiler }})
    needs: [corrosion-source]
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang-cl]
    env:
      RUST_BACKTRACE: full
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6

      - name: Download pinned Corrosion source
        uses: actions/download-artifact@v8
        with:
          name: corrosion-source-v0.6.1
          path: ${{ runner.temp }}/classic-corrosion-artifact

      - name: Verify and extract pinned Corrosion source
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'classic-corrosion-artifact'
          $archivePath = Join-Path $artifactDir 'corrosion-source.zip'
          $revision = (Get-Content -LiteralPath (Join-Path $artifactDir 'corrosion-source.commit') -Raw).Trim()
          if ($revision -cne '1499b14e4906a2890f5cee1547c8848db261753d') {
            throw "Downloaded Corrosion source has unexpected revision '$revision'."
          }
          $expectedDigest = (Get-Content -LiteralPath (Join-Path $artifactDir 'corrosion-source.sha256') -Raw).Trim()
          $actualDigest = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualDigest -cne $expectedDigest) { throw 'Downloaded Corrosion source digest does not match.' }
          $sourceDir = Join-Path $env:RUNNER_TEMP 'classic-corrosion-source'
          Expand-Archive -LiteralPath $archivePath -DestinationPath $sourceDir -Force
          if (-not (Test-Path -LiteralPath (Join-Path $sourceDir 'CMakeLists.txt') -PathType Leaf)) {
            throw 'Downloaded Corrosion source is missing CMakeLists.txt.'
          }
          "CLASSIC_CORROSION_SOURCE_DIR=$sourceDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.compiler }}-cargo-cpp-gui-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('foundation/**/*.rs', 'business-logic/**/*.rs', 'cpp-bindings/**/*.rs', 'ui-applications/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-cargo-cpp-gui-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-${{ matrix.compiler }}-cargo-cpp-gui-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase
          cache: true
          cache-key-prefix: classic-gui-qt

      - name: Configure Qt CMake path
        shell: pwsh
        run: |
          if (-not $env:QT_ROOT_DIR) {
            throw "QT_ROOT_DIR was not set by install-qt-action."
          }
          $prefixes = @($env:QT_ROOT_DIR)
          if ($env:CMAKE_PREFIX_PATH) {
            $prefixes += $env:CMAKE_PREFIX_PATH
          }
          "CMAKE_PREFIX_PATH=$($prefixes -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: GUI test preflight diagnostics
        shell: pwsh
        run: |
          cmake --version
          ctest --version
          Write-Host "QT_QPA_PLATFORM=$env:QT_QPA_PLATFORM"
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          Write-Host "Qt6_DIR=$env:Qt6_DIR"
          Write-Host "CMAKE_PREFIX_PATH=$env:CMAKE_PREFIX_PATH"

      - name: Verify Qt resolution policy
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File classic-gui/verify_qt_resolution.ps1

      - name: Build and test GUI
        run: pwsh -ExecutionPolicy Bypass -File classic-gui/build_gui.ps1 -Preset ci-system-qt -Test -TestTimeoutSec 600 -Compiler ${{ matrix.compiler }}

      # Reuses the ci-system-qt build above through `-Test -TestOnly`; see
      # cli-tests for why the artifact root is under runner.temp.
      - name: Run GUI consumer conformance
        if: ${{ !cancelled() }}
        run: cargo xtask conformance run --participant gui --compiler ${{ matrix.compiler }} --preset ci-system-qt --artifact-root ${{ runner.temp }}/conformance

      - name: Upload GUI consumer conformance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gui-conformance-${{ matrix.compiler }}
          path: ${{ runner.temp }}/conformance/gui/windows-${{ matrix.compiler }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gui-test-diagnostics-${{ matrix.compiler }}
          path: |
            classic-gui/build*/Testing/
            classic-gui/build-qt-policy-check/
            classic-gui/build*/CMakeFiles/CMake*.log
            classic-gui/build*/CMakeFiles/CMakeConfigureLog.yaml
            classic-gui/build*/vcpkg*.log
            classic-gui/build*/**/vcpkg*.log
          if-no-files-found: warn
          retention-days: 7
