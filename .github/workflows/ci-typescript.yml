name: CI — TypeScript

on:
  workflow_call:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  parity-gates:
    name: Node Parity Gates
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-node-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('foundation/**/*.rs', 'business-logic/**/*.rs', 'cpp-bindings/**/*.rs', 'node-bindings/**/*.rs', 'python-bindings/**/*.rs', 'ui-applications/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-node-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-node-

      - name: Install npm dependencies
        working-directory: node-bindings/classic-node
        run: bun install --frozen-lockfile

      - name: Build NAPI-RS binary
        working-directory: node-bindings/classic-node
        run: bun run build

      - name: Verify NAPI binary exists
        working-directory: node-bindings/classic-node
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Filter "*.node" -Recurse
          if ($binary) {
            Write-Host "NAPI binary found: $($binary.FullName) ($([math]::Round($binary.Length / 1MB, 2)) MB)"
          } else {
            Write-Error "NAPI binary not found after build"
            exit 1
          }

      - name: Install User Settings conformance YAML parser
        run: python -m pip install --disable-pip-version-check "ruamel.yaml>=0.18,<0.19"

      - name: Run Node binding compliance profile
        run: python tools/binding_compliance/check_compliance.py --repo-root . --profile node-ci --gate-evidence-out tools/binding_compliance/artifacts/retained/node-ci/gate_evidence.json

      - name: Upload Node parity retained gate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: node-parity-retained-gates
          path: tools/binding_compliance/artifacts/retained/
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

      - name: Upload parity and runtime coverage diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: node-parity-diagnostics
          path: |
            tools/binding_compliance/artifacts/
            node-bindings/classic-node/parity-artifacts/
          if-no-files-found: warn
          retention-days: 7

  build-and-test:
    name: NAPI-RS Build + Runtime Tests (${{ matrix.runtime }})
    needs: [parity-gates]
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Both runtime branches use the Python launcher to record retained gate evidence.
      - name: Set up Python for retained gates and scan conformance
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-node-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('foundation/**/*.rs', 'business-logic/**/*.rs', 'cpp-bindings/**/*.rs', 'node-bindings/**/*.rs', 'python-bindings/**/*.rs', 'ui-applications/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-node-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-node-

      - name: Install npm dependencies
        working-directory: node-bindings/classic-node
        run: bun install --frozen-lockfile

      - name: Build NAPI-RS binary
        working-directory: node-bindings/classic-node
        run: bun run build

      - name: Verify NAPI binary exists
        working-directory: node-bindings/classic-node
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Filter "*.node" -Recurse
          if ($binary) {
            Write-Host "NAPI binary found: $($binary.FullName) ($([math]::Round($binary.Length / 1MB, 2)) MB)"
          } else {
            Write-Error "NAPI binary not found after build"
            exit 1
          }

      - name: Run Bun tests
        if: matrix.runtime == 'bun'
        run: python tools/binding_compliance/run_retained_gate.py --repo-root . --gate-id node-bun-runtime-tests --gate-evidence-out tools/binding_compliance/artifacts/retained/node-bun-runtime-tests/gate_evidence.json

      - name: Run Node runtime smoke tests
        if: matrix.runtime == 'node'
        run: python tools/binding_compliance/run_retained_gate.py --repo-root . --gate-id node-node-runtime-tests --gate-evidence-out tools/binding_compliance/artifacts/retained/node-node-runtime-tests/gate_evidence.json

      - name: Upload Node runtime retained gate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: node-runtime-retained-gates-${{ matrix.runtime }}
          path: tools/binding_compliance/artifacts/retained/
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

      - name: Install User Settings conformance YAML parser
        if: matrix.runtime == 'node'
        run: python -m pip install --disable-pip-version-check "ruamel.yaml>=0.18,<0.19"

      - name: Run Node Crash Log Scan Run conformance
        if: matrix.runtime == 'node' && !cancelled()
        run: python tools/binding_compliance/run_scan_run_conformance.py --participant node

      # Existing runtime and registry-backed parity gates remain blocking.
      - name: Run Node User Settings conformance
        if: matrix.runtime == 'node' && !cancelled()
        run: python tools/binding_compliance/run_user_settings_conformance.py --participant node --artifact-root tools/binding_compliance/artifacts/user-settings

      - name: Upload Node User Settings conformance diagnostics
        if: matrix.runtime == 'node' && always()
        uses: actions/upload-artifact@v6
        with:
          name: node-user-settings-conformance
          path: tools/binding_compliance/artifacts/user-settings/node/node/
          if-no-files-found: warn
          retention-days: 7

      - name: Run Node crash-suspect conformance
