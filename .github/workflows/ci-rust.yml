name: CI — Rust

on:
  push:
    branches: [classic-next]
  pull_request:
    branches: [classic-next]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.12"

jobs:
  format:
    name: Formatting (rustfmt)
    runs-on: windows-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run rustfmt check
        run: cargo fmt --all -- --check

  lint:
    name: Linting (Clippy)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('foundation/**/*.rs', 'business-logic/**/*.rs', 'cpp-bindings/**/*.rs', 'node-bindings/**/*.rs', 'python-bindings/**/*.rs', 'ui-applications/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-build-

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run runtime/GIL pattern guard
        run: python tools/runtime_gil_patterns/check_runtime_gil_patterns.py --repo-root .

  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('foundation/**/*.rs', 'business-logic/**/*.rs', 'cpp-bindings/**/*.rs', 'node-bindings/**/*.rs', 'python-bindings/**/*.rs', 'ui-applications/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-build-

      - name: Build all Rust workspace
        run: cargo build --workspace --release

  test:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('foundation/**/*.rs', 'business-logic/**/*.rs', 'cpp-bindings/**/*.rs', 'node-bindings/**/*.rs', 'python-bindings/**/*.rs', 'ui-applications/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-test-

      - name: Run phase-1 logging contract tests (Rust)
        run: cargo test -p classic-message-core -- --nocapture

      - name: Run Rust tests
        run: cargo test --workspace --release -- --nocapture

      - name: Run Rust tests with all features
        run: cargo test --workspace --release --all-features -- --nocapture

      - name: Validate Crash Log Scan Run variant coverage
        if: ${{ !cancelled() }}
        run: python tools/binding_compliance/scan_run_contract.py --repo-root .

      - name: Install User Settings conformance YAML parser
        run: python -m pip install --disable-pip-version-check "ruamel.yaml>=0.18,<0.19"

      - name: Run Rust Crash Log Scan Run conformance
        if: ${{ !cancelled() }}
        run: python tools/binding_compliance/run_scan_run_conformance.py --participant rust

      - name: Upload Rust Crash Log Scan Run conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-scan-run-conformance
          path: tools/binding_compliance/artifacts/rust/rust/
          if-no-files-found: warn
          retention-days: 7

      # Settings receipts and retained corpus tests must both pass on this checkout.
      - name: Run Rust User Settings conformance
        if: ${{ !cancelled() }}
        run: python tools/binding_compliance/run_user_settings_conformance.py --participant rust --artifact-root tools/binding_compliance/artifacts/user-settings

      - name: Upload Rust User Settings conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-user-settings-conformance
          path: tools/binding_compliance/artifacts/user-settings/rust/rust/
          if-no-files-found: warn
          retention-days: 7

      - name: Run Rust crash-suspect conformance
        if: ${{ !cancelled() }}
        run: python tools/binding_compliance/run_semantic_conformance.py --family crash-suspect --participant rust --artifact-root tools/binding_compliance/artifacts/crash-suspect

      - name: Upload Rust crash-suspect conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-crash-suspect-conformance
          path: tools/binding_compliance/artifacts/crash-suspect/rust/rust/
          if-no-files-found: warn
          retention-days: 7

      - name: Run Rust crashgen-settings conformance
        if: ${{ !cancelled() }}
        run: python tools/binding_compliance/run_semantic_conformance.py --family crashgen-settings --participant rust --artifact-root tools/binding_compliance/artifacts/crashgen-settings

      - name: Upload Rust crashgen-settings conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-crashgen-settings-conformance
          path: tools/binding_compliance/artifacts/crashgen-settings/rust/rust/
          if-no-files-found: warn
          retention-days: 7

      - name: Run Rust mod-guidance conformance
        if: ${{ !cancelled() }}
        run: python tools/binding_compliance/run_semantic_conformance.py --family mod-guidance --participant rust --artifact-root tools/binding_compliance/artifacts/mod-guidance

      - name: Upload Rust mod-guidance conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-mod-guidance-conformance
          path: tools/binding_compliance/artifacts/mod-guidance/rust/rust/
          if-no-files-found: warn
          retention-days: 7

      - name: Run Rust formid-lookup conformance
        if: ${{ !cancelled() }}
        run: python tools/binding_compliance/run_semantic_conformance.py --family formid-lookup --participant rust --artifact-root tools/binding_compliance/artifacts/formid-lookup

      - name: Upload Rust formid-lookup conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-formid-lookup-conformance
          path: tools/binding_compliance/artifacts/formid-lookup/rust/rust/
          if-no-files-found: warn
          retention-days: 7

      - name: Run Rust named-record conformance
        if: ${{ !cancelled() }}
        run: python tools/binding_compliance/run_semantic_conformance.py --family named-record --participant rust --artifact-root tools/binding_compliance/artifacts/named-record

      - name: Upload Rust named-record conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-named-record-conformance
          path: tools/binding_compliance/artifacts/named-record/rust/rust/
          if-no-files-found: warn
          retention-days: 7

      - name: Run Rust plugin-evidence conformance
        if: ${{ !cancelled() }}
        run: python tools/binding_compliance/run_semantic_conformance.py --family plugin-evidence --participant rust --artifact-root tools/binding_compliance/artifacts/plugin-evidence

      - name: Upload Rust plugin-evidence conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-plugin-evidence-conformance
          path: tools/binding_compliance/artifacts/plugin-evidence/rust/rust/
          if-no-files-found: warn
          retention-days: 7

      - name: Run Rust installed-yaml-data conformance
        if: ${{ !cancelled() }}
        run: python tools/binding_compliance/run_semantic_conformance.py --family installed-yaml-data --participant rust --artifact-root tools/binding_compliance/artifacts/installed-yaml-data

      - name: Upload Rust installed-yaml-data conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-installed-yaml-data-conformance
          path: tools/binding_compliance/artifacts/installed-yaml-data/rust/rust/
          if-no-files-found: warn
          retention-days: 7

      - name: Run TUI Crash Log Scan Run consumer conformance
        if: ${{ !cancelled() }}
        run: python tools/binding_compliance/run_scan_run_consumer_conformance.py --participant tui

      - name: Upload TUI consumer conformance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tui-consumer-conformance
          path: tools/binding_compliance/artifacts/tui/tui/
          if-no-files-found: warn
          retention-days: 7

      - name: Run TUI User Settings consumer conformance
        if: ${{ !cancelled() }}
        run: python tools/binding_compliance/run_scan_run_consumer_conformance.py --family user-settings --participant tui --artifact-root tools/binding_compliance/artifacts/user-settings

      - name: Upload TUI User Settings consumer conformance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tui-user-settings-consumer-conformance
          path: tools/binding_compliance/artifacts/user-settings/tui/tui/
          if-no-files-found: warn
          retention-days: 7
