name: CI — Rust

on:
  workflow_call:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Formatting (rustfmt)
    if: "false" # Disabled until further notice
    runs-on: windows-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run rustfmt check
        run: cargo fmt --all -- --check

  lint:
    name: Linting (Clippy)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('foundation/**/*.rs', 'business-logic/**/*.rs', 'cpp-bindings/**/*.rs', 'ui-applications/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-build-

      - name: Check User Settings exclusive ownership
        run: cargo xtask user-settings-ownership

      - name: Check conformance packs, catalogs and workflow policy
        run: cargo xtask conformance check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('foundation/**/*.rs', 'business-logic/**/*.rs', 'cpp-bindings/**/*.rs', 'ui-applications/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-build-

      - name: Build all Rust workspace
        run: cargo build --workspace --release

  test:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('foundation/**/*.rs', 'business-logic/**/*.rs', 'cpp-bindings/**/*.rs', 'ui-applications/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-test-

      - name: Run phase-1 logging contract tests (Rust)
        run: cargo test -p classic-message-core -- --nocapture

      - name: Run Rust tests
        run: cargo test --workspace --release -- --nocapture

      - name: Run Rust tests with all features
        run: cargo test --workspace --release --all-features -- --nocapture

      - name: Validate Crash Log Scan Run variant coverage
        if: ${{ !cancelled() }}
        run: cargo xtask scan-run-contract

      # One run per participant runs every family that requires it, keeps going
      # past failed families, and names them all at the end. The artifact root
      # lives under runner.temp, not target/, so a restored build cache can
      # never carry an earlier run's plans into this upload (two runs of one
      # instance are duplicate evidence to the verdict).
      - name: Run Rust conformance
        if: ${{ !cancelled() }}
        run: cargo xtask conformance run --participant rust --artifact-root ${{ runner.temp }}/conformance

      - name: Run TUI consumer conformance
        if: ${{ !cancelled() }}
        run: cargo xtask conformance run --participant tui --artifact-root ${{ runner.temp }}/conformance

      - name: Upload Rust conformance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-conformance
          path: ${{ runner.temp }}/conformance/rust/rust/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload TUI consumer conformance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tui-conformance
          path: ${{ runner.temp }}/conformance/tui/tui/
          if-no-files-found: warn
          retention-days: 7

  # Blocking: the YAML Data and app-notification publishes run
  # `cargo xtask yaml-data` / `cargo xtask app-notification` on ubuntu-latest,
  # so this proves the publish tooling builds and runs there, and gives YAML
  # Data and notification-source edits PR-time validation. It does not run
  # `cargo test -p xtask`, because the Linux build of the core crates xtask's
  # tests depend on is unproven.
  xtask-linux:
    name: xtask (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build xtask
        run: cargo build -p xtask --locked

      - name: Validate YAML Data
        run: cargo xtask yaml-data validate --databases-dir "CLASSIC Data/databases" --schema-ranges "CLASSIC Data/databases/client-schema-ranges.yaml"

      - name: Validate app-notification source
        run: cargo xtask app-notification validate --source "CLASSIC Data/app-notification.yaml"

      # No tag exists in the checkout, so the dry run takes its "current UTC
      # time" fallback for published_at and exercises the full local publish.
      - name: Dry-run app-notification publish
        run: cargo xtask app-notification dry-run --workflow-tag app-notification-v0.0.0
