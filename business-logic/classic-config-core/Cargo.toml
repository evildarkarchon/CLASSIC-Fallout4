[package]
name = "classic-config-core"
version = "9.1.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["CLASSIC Development Team"]
description = "Pure Rust configuration loading business logic for CLASSIC"
repository = "https://github.com/evildarkarchon/CLASSIC-Fallout4"

[lib]
crate-type = ["rlib"] # Pure Rust library ONLY - no PyO3

[dependencies]
# CLASSIC shared utilities (provides runtime)
classic-shared-core = { path = "../../foundation/classic-shared-core" }

# Registry (provides APP_DIR override for generic cache paths)
classic-registry-core = { path = "../classic-registry-core" }

classic-version-registry-core = { path = "../classic-version-registry-core" }

# FileIOError, the published error type of the YAML Data install/rollback/
# self-heal and Ignore/Local YAML generation operations this crate owns
# (src/atomic_install.rs, src/generation.rs; moved here from file I/O in #248).
# The per-user YAML cache location is owned by this crate (src/yaml_cache.rs),
# so config does not depend on classic-path-core.
classic-file-io-core = { path = "../classic-file-io-core" }

# Durable Publication (staging, verified backup, atomic publish) for the
# Local Ignore reset critical section and the YAML Data install path
# (digest verification, the `.prev` rollback generation, and the one
# cross-process lock that rollback and self-heal also serialize on). Backup
# location, conflict policy, and the reset lock stay here; only the durability
# sequence lives there.
classic-durable-publication = { path = "../classic-durable-publication" }

# Workspace-internal Vocabulary naming contract: this crate owns the frozen
# Vocabulary Tokens and the Display Labels for its own Installed YAML Data and
# Local Ignore enums, so that the three bindings project them instead of each
# keeping a table.
classic-vocabulary = { path = "../../foundation/classic-vocabulary" }

# Async runtime (for JoinSet and file I/O)
tokio = { workspace = true, features = ["full"] }

# YAML parsing
yaml-rust2 = { workspace = true }

# Ordered collections (preserves YAML key order for Python parity)
indexmap = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
dirs = { workspace = true }
tempfile = { workspace = true }
fs4 = { version = "0.12", features = ["sync"] }
atomicwrites = "0.4.4"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
log = { workspace = true }

[dev-dependencies]
serial_test = "3.2"

[lints.rust]
deprecated = "deny"
rust_2024_compatibility = "warn"
unsafe_code = "deny"             # We don't use unsafe in CLASSIC
missing_docs = "warn"            # Encourage documentation
unused = "deny"
