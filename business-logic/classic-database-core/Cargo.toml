[package]
authors = ["CLASSIC Development Team"]
description = "Pure Rust database operations for CLASSIC"
edition = "2024"
name = "classic-database-core"
repository = "https://github.com/evildarkarchon/CLASSIC-Fallout4"
rust-version = "1.96.0"
version = "9.1.0"

[lib]
crate-type = ["rlib"] # Pure Rust library only

[dependencies]
# CLASSIC shared utilities
classic-shared-core = {path = "../../foundation/classic-shared-core"}

# Database (sqlx for true async support)
sqlx = {workspace = true}

# Async runtime
futures = {workspace = true}
tokio = {workspace = true, features = ["full"]}

# Caching and concurrency
dashmap = {workspace = true}
num_cpus = {workspace = true}
parking_lot = {workspace = true}

# Error handling
anyhow = {workspace = true}
thiserror = {workspace = true}

# Logging
log = {workspace = true}

[dev-dependencies]
criterion = {version = "0.8.2", features = ["html_reports"]}
tempfile = {workspace = true}

[[bench]]
harness = false
name = "database_benchmarks"

[lints.rust]
deprecated = "deny"
missing_docs = "warn" # Encourage documentation
rust_2024_compatibility = "warn"
unsafe_code = "deny" # We don't use unsafe in CLASSIC
unused = "deny"
