[package]
name = "classic-resource-core"
version = "9.1.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["CLASSIC Development Team"]
description = "Resource management for game files (no PyO3)"
repository = "https://github.com/evildarkarchon/CLASSIC-Fallout4"

[lib]
crate-type = ["rlib"]  # Pure Rust library only - no PyO3

[dependencies]
# Generic path primitives and PathError
classic-shared-core = { path = "../../foundation/classic-shared-core" }
# Neutral DDS header parsing (`DDSHeader`) stays in file I/O core; resource
# core owns the game-target DDS rules applied to parsed headers (#249). The
# edge points inward only: file I/O must never depend back on resource core.
classic-file-io-core = { path = "../classic-file-io-core" }

# Parallel batch validation of DDS textures
rayon = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# File I/O
walkdir = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }

# NO PyO3 dependency!

[dev-dependencies]
# Testing
tempfile = { workspace = true }
# Builds real DDS fixtures for the game-target DDS rule tests
ddsfile = { workspace = true }

[lints.rust]
deprecated = "deny"
rust_2024_compatibility = "warn"
unsafe_code = "deny"
missing_docs = "warn"
unused = "deny"
