[package]
name = "classic-user-settings-core"
version = "9.1.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["CLASSIC Development Team"]
description = "Typed, preservation-aware User Settings business logic for CLASSIC"
repository = "https://github.com/evildarkarchon/CLASSIC-Fallout4"

[lib]
crate-type = ["rlib"]

[dependencies]
classic-shared-core = { path = "../../foundation/classic-shared-core" }
classic-settings-core = { path = "../classic-settings-core" }

# Workspace-internal Durable Publication: staging, synchronization, the platform publish step,
# and the one cross-process lock implementation.
classic-durable-publication = { path = "../classic-durable-publication" }

# Workspace-internal Vocabulary naming contract: this crate owns the frozen
# Vocabulary Tokens and the Display Labels for its own domain enums, so that the
# three bindings project them instead of each keeping a table.
classic-vocabulary = { path = "../../foundation/classic-vocabulary" }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Test roots only. Staging temporary files is no longer this crate's business: it moved to
# `classic-durable-publication`, and keeping `tempfile` out of `[dependencies]` is what stops it
# quietly coming back.
tempfile = { workspace = true }

[lints.rust]
deprecated = "deny"
rust_2024_compatibility = "warn"
unsafe_code = "deny"
missing_docs = "warn"
unused = "deny"
