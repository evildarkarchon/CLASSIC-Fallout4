[package]
name = "classic-version-core"
version = "9.1.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["CLASSIC Development Team"]
description = "Known game-version queries and a transitional facade over shared-core version helpers for CLASSIC (no PyO3)"
repository = "https://github.com/evildarkarchon/CLASSIC-Fallout4"

[lib]
crate-type = ["rlib"]  # Pure Rust library only - no PyO3

[dependencies]
# Version handling
semver = "1.0"

# Owner of the loose version and PE helpers this crate re-exports until it
# retires (#258)
classic-shared-core = { path = "../../foundation/classic-shared-core" }

# Version registry access (known-version policy)
classic-version-registry-core = { path = "../classic-version-registry-core" }

# NO PyO3 dependency!

[lints.rust]
deprecated = "deny"
rust_2024_compatibility = "warn"
unsafe_code = "deny"
missing_docs = "warn"
unused = "deny"
