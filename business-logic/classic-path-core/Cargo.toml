[package]
authors = ["CLASSIC Development Team"]
description = "Core path management for CLASSIC (game paths, documents, validation)"
edition = "2024"
license = "MIT"
name = "classic-path-core"
rust-version = "1.96.0"
version = "9.1.0"

[dependencies]
# Generic path primitives, PathError, and the OS cache root
classic-shared-core = {path = "../../foundation/classic-shared-core"}

# Error handling
anyhow = {workspace = true}
thiserror = {workspace = true}

# File I/O and paths
dirs = {workspace = true}
walkdir = {workspace = true}

# INI parsing
configparser = "3.1"

# Serialization (for Any type handling)
serde = {workspace = true}
serde_json = {workspace = true}

# Windows registry access
[target.'cfg(windows)'.dependencies]
winreg = {workspace = true}

[dev-dependencies]
# Testing
serial_test = "4.0.1"
tempfile = {workspace = true}

[lib]
crate-type = ["rlib"]

[lints.rust]
deprecated = "deny"
missing_docs = "warn" # Encourage documentation
rust_2024_compatibility = "warn"
unsafe_code = "deny" # We don't use unsafe in CLASSIC
unused = "deny"
