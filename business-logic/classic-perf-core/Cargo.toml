[package]
name = "classic-perf-core"
version = "9.1.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["CLASSIC Development Team"]
description = "Seconds-based timing facade over classic-shared-core for CLASSIC"
license = "MIT"

[dependencies]
# Sole timing implementation; this crate only re-exports its seconds view
classic-shared-core = { path = "../../foundation/classic-shared-core" }

[dev-dependencies]
# Testing
serial_test = "3.2"

[lib]
crate-type = ["rlib"]

[[example]]
name = "basic_timing"
path = "examples/basic_timing.rs"

[lints.rust]
deprecated = "deny"
rust_2024_compatibility = "warn"
unsafe_code = "deny"  # We don't use unsafe in CLASSIC
missing_docs = "warn"   # Encourage documentation
unused = "deny"
