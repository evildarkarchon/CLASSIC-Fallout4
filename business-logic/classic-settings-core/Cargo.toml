[package]
name = "classic-settings-core"
version = "9.1.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["CLASSIC Development Team"]
description = "CLASSIC YAML settings facade over classic-shared-core generic YAML, plus YamlFile and YamlOperations"
license = "MIT"

[features]
default = []
dhat-heap = ["dep:dhat"]

[dependencies]
# Heap profiling (optional)
dhat = { version = "0.3", optional = true }

# Tracing for instrumentation
tracing = { workspace = true }
# Owner of the generic YAML rules and logical-key cache this crate re-exports
classic-shared-core = { path = "../../foundation/classic-shared-core" }

# YAML parsing
yaml-rust2 = { workspace = true }

# Path/mtime-aware YAML-file cache
quick_cache = { workspace = true }

# Data parallelism
rayon = { workspace = true }

# Serialization
serde = { workspace = true }

# Ordered collections (preserves YAML key order)
indexmap = { workspace = true }

[dev-dependencies]
serial_test = "3.2"
tempfile = "3.14"
criterion = { version = "0.8.2", features = ["html_reports"] }
serde_json = { workspace = true }
tokio = { workspace = true }

[[bench]]
name = "yaml_benchmarks"
harness = false

[lints.rust]
deprecated = "deny"
rust_2024_compatibility = "deny"
unsafe_code = "deny"
missing_docs = "warn"
unused = "deny"
