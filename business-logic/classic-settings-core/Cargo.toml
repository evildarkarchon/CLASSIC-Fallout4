[package]
name = "classic-settings-core"
version = "9.1.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["CLASSIC Development Team"]
description = "CLASSIC YAML settings facade over classic-shared-core generic YAML and YAML operations"
license = "MIT"

[dependencies]
# Owner of the generic YAML rules, YAML operations, and both YAML caches this
# crate re-exports
classic-shared-core = { path = "../../foundation/classic-shared-core" }

[dev-dependencies]
serial_test = "3.2"
tempfile = "3.14"
tokio = { workspace = true }

[lints.rust]
deprecated = "deny"
rust_2024_compatibility = "deny"
unsafe_code = "deny"
missing_docs = "warn"
unused = "deny"
