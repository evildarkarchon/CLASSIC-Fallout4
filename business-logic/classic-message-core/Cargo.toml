[package]
authors = ["CLASSIC Development Team"]
description = "Core message routing and formatting for CLASSIC"
edition = "2024"
license = "MIT"
name = "classic-message-core"
rust-version = "1.96.0"
version = "9.1.0"

[dependencies]
# Logging
env_logger = {workspace = true}
log = {workspace = true}

# Serialization (for message formatting)
serde = {workspace = true, features = ["derive"]}

[dev-dependencies]
# Testing
serial_test = "4.0.1"

[lints.rust]
deprecated = "deny"
missing_docs = "warn"
rust_2024_compatibility = "deny"
unsafe_code = "deny"
unused = "deny"
