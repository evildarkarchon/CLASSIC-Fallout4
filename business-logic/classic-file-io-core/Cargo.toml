[package]
name = "classic-file-io-core"
version = "9.1.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["CLASSIC Development Team"]
description = "Pure Rust file I/O operations for CLASSIC (no PyO3)"
repository = "https://github.com/evildarkarchon/CLASSIC-Fallout4"

[lib]
crate-type = ["rlib"]  # Pure Rust library only - no PyO3

[dependencies]
# CLASSIC shared utilities
classic-shared-core = { path = "../../foundation/classic-shared-core" }
# Crash Log collection (and with it the XSE Folder and operation-context
# cancellation dependencies) moved to classic-scanlog-core (#254).

# The YAML Data install/rollback/self-heal path, and with it the dependency on
# classic-durable-publication, moved to classic-config-core (#248).

# File I/O
encoding_rs = { workspace = true }
memmap2 = { workspace = true }
walkdir = { workspace = true }
ddsfile = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }

# Caching and concurrency
dashmap = { workspace = true }
lru = { workspace = true }
quick_cache = { workspace = true }  # Optimization 1.3: Lock-free concurrent cache
parking_lot = { workspace = true }
rayon = { workspace = true }

# Parsing
regex = { workspace = true }

# Hashing
sha2 = "0.10"

# Cross-process file locking for atomic install / rollback serialization comes
# from `classic-durable-publication` (std's `File::lock`), used by the install
# path now owned by classic-config-core. The former `fs4` dependency was this
# crate's only use of that library.

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
log = { workspace = true }
tracing = { workspace = true }

# Time handling
chrono = "0.4"

# NO PyO3 dependency!

[dev-dependencies]
tempfile = { workspace = true }
serial_test = "3.2"
criterion = { version = "0.6.0", features = ["html_reports"] }

[[bench]]
name = "file_io_benchmarks"
harness = false

[lints.rust]
deprecated = "deny"
rust_2024_compatibility = "warn"
unsafe_code = "warn"  # Allow unsafe for memory-mapped I/O (properly documented)
missing_docs = "warn"   # Encourage documentation
unused = "deny"
