name: CI - C++

on:
  push:
    branches: [classic-next]
  pull_request:
    branches: [classic-next]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  cxx-parity-gate:
    name: Binding Compliance Gate (C++)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install User Settings conformance YAML parser
        run: python -m pip install --disable-pip-version-check "ruamel.yaml>=0.18,<0.19"

      - name: Run CXX binding compliance profile
        run: python tools/binding_compliance/check_compliance.py --repo-root . --profile cxx-ci

      - name: Upload CXX binding compliance diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cxx-parity-diagnostics
          path: |
            tools/binding_compliance/artifacts/
            cpp-bindings/classic-cpp-bridge/parity-artifacts/
          if-no-files-found: warn
          retention-days: 7

  cli-tests:
    name: CLI Tests (${{ matrix.compiler }})
    needs: [cxx-parity-gate]
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang-cl]
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.compiler }}-cargo-cpp-cli-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('foundation/**/*.rs', 'business-logic/**/*.rs', 'cpp-bindings/**/*.rs', 'node-bindings/**/*.rs', 'python-bindings/**/*.rs', 'ui-applications/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-cargo-cpp-cli-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-${{ matrix.compiler }}-cargo-cpp-cli-

      - name: Cache vcpkg root
        uses: actions/cache@v5
        with:
          path: ~\vcpkg
          key: ${{ runner.os }}-${{ matrix.compiler }}-vcpkg-root-${{ hashFiles('.github/scripts/setup-vcpkg.ps1', 'classic-cli/vcpkg.json', 'classic-gui/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-vcpkg-root-

      - name: Set up vcpkg (resilient)
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File .github/scripts/setup-vcpkg.ps1

      - name: Build and test CLI
        timeout-minutes: 90
        run: pwsh -ExecutionPolicy Bypass -File classic-cli/build_cli.ps1 -Test -Compiler ${{ matrix.compiler }}

      - name: Install User Settings conformance YAML parser
        run: python -m pip install --disable-pip-version-check "ruamel.yaml>=0.18,<0.19"

      - name: Run native CXX scan conformance
        if: ${{ !cancelled() }}
        run: pwsh -ExecutionPolicy Bypass -File tools/binding_compliance/conformance/adapters/run_cxx_conformance.ps1 -Compiler ${{ matrix.compiler }}

      - name: Upload native CXX scan conformance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cxx-conformance-${{ matrix.compiler }}
          path: |
            tools/binding_compliance/artifacts/cxx/windows-${{ matrix.compiler }}/**/run_plan.json
            tools/binding_compliance/artifacts/cxx/windows-${{ matrix.compiler }}/**/receipt.json
            tools/binding_compliance/artifacts/cxx/windows-${{ matrix.compiler }}/**/ctest.junit.xml
            tools/binding_compliance/artifacts/cxx/windows-${{ matrix.compiler }}/**/attempt.json
            tools/binding_compliance/artifacts/cxx/windows-${{ matrix.compiler }}/**/stdout.log
            tools/binding_compliance/artifacts/cxx/windows-${{ matrix.compiler }}/**/stderr.log
            tools/binding_compliance/artifacts/cxx/windows-${{ matrix.compiler }}/**/binding_compliance_report.json
            tools/binding_compliance/artifacts/cxx/windows-${{ matrix.compiler }}/**/binding_compliance_report.md
            classic-cli/build*/Testing/
