[package]
name = "classic-tui"
version = "9.1.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["CLASSIC Development Team"]
description = "Ratatui terminal UI for CLASSIC"
repository = "https://github.com/evildarkarchon/CLASSIC-Fallout4"

[[bin]]
name = "classic-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"

classic-shared-core = { path = "../../foundation/classic-shared-core" }
classic-scanlog-core = { path = "../../business-logic/classic-scanlog-core" }
# Crash Log Scan Run Display Content. The TUI links this crate directly and never crosses a binding
# seam, so it renders the display lines core produces rather than composing its own sentences about
# a run. It is the first frontend to depend on it, which is why it proves the segment model.
classic-scan-presentation = { path = "../../business-logic/classic-scan-presentation" }
# The final scan-run contract exposes Installed YAML Data provenance from config core without
# re-exporting it, so naming those types directly still requires the dependency. Presentation no
# longer does; the scan-run sibling tests do, to build the fixtures the contract consumes.
classic-config-core = { path = "../../business-logic/classic-config-core" }
classic-user-settings-core = { path = "../../business-logic/classic-user-settings-core" }
classic-file-io-core = { path = "../../business-logic/classic-file-io-core" }
classic-path-core = { path = "../../business-logic/classic-path-core" }
classic-scangame-core = { path = "../../business-logic/classic-scangame-core" }
classic-update-core = { path = "../../business-logic/classic-update-core" }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }
directories = { workspace = true }
pulldown-cmark = { workspace = true }

open = "5"
arboard = "3"
color-eyre = "0.6"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"

[dev-dependencies]
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
temp-env = "0.3.6"
# A dev dependency rather than a runtime one, which is the shape of what this frontend became: no
# code under `src/` calls `label()` any more, because every Display Label the TUI shows now arrives
# inside a `DisplaySegment::Label` from `classic-scan-presentation`. The tests still need the trait
# — they walk `VARIANTS` and compare `as_str()` against `label()` to prove no Vocabulary Token
# reaches the user — and that is the only thing left holding the edge.
classic-vocabulary = { path = "../../foundation/classic-vocabulary" }

[lints.rust]
deprecated = "deny"
unsafe_code = "deny"
unused = "deny"
missing_docs = "allow"
