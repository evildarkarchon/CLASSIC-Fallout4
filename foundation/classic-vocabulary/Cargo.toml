[package]
name = "classic-vocabulary"
version = "9.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false
authors = ["CLASSIC Development Team"]
description = "Workspace-internal Vocabulary naming contract for CLASSIC domain enums"
repository = "https://github.com/evildarkarchon/CLASSIC-Fallout4"

[lib]
crate-type = ["rlib"] # Pure Rust library ONLY - no PyO3

# Deliberately dependency-free. The naming contract is a trait plus two
# functions over `&'static str`; anything it pulled in would be inherited by
# every core crate that owns a domain enum.
[dependencies]

[lints.rust]
deprecated = "deny"
rust_2024_compatibility = "deny"
unsafe_code = "deny"
missing_docs = "warn"
unused = "deny"
